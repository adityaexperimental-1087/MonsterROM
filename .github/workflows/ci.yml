name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Device Codename'
        type: choice
        default: r9s
        options:
          - r9s
          - o1s
          - t2s
          - p3s

jobs:
  build-and-upload:
    name: Build ROM & Upload to GoFile
    runs-on: [self-hosted, linux, x64, monsterrom]
    timeout-minutes: 180
    env:
      BUILD_TARGET: ${{ inputs.target || 'r9s' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          clean: false

      - name: Build ROM
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source ./buildenv.sh "$BUILD_TARGET"
          ./scripts/build_dependencies.sh
          ./scripts/make_rom.sh -z

      - name: Upload ROM to GoFile
        shell: bash
        run: |
          set -euo pipefail
          ROM_ZIP=$(find out -name "*.zip" | head -n 1)
          if [ -z "$ROM_ZIP" ]; then
            echo "Error: ROM zip not found!"
            exit 1
          fi
          echo "Found ROM zip: $ROM_ZIP"

          # Get available GoFile server
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store1"')
          echo "Uploading to GoFile server: $SERVER"

          RESPONSE=$(curl -s -F "file=@$ROM_ZIP" "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "$RESPONSE"

          LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          if [ -n "$LINK" ]; then
            echo "=========================================="
            echo "ROM uploaded successfully!"
            echo "Download Link: $LINK"
            echo "=========================================="
            echo "gofile_link=$LINK" >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Could not extract GoFile download link from response."
          fi
